[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmo"
version = "0.1.0"
description = "Physics-based PyBaMM rate model of a LiMn2O4 half cell fitted to measured galvanostatic data"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
